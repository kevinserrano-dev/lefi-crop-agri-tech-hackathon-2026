name: Simulator

on:
  push:
    paths: ["simulators/greenhouse/**", "packages/contracts/**", ".github/workflows/simulator.yml"]
  pull_request:
    paths: ["simulators/greenhouse/**", "packages/contracts/**", ".github/workflows/simulator.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulators/greenhouse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
