[package]
name = "lefi-desktop"
version = "0.13.0"
description = "Lefi Desktop — LEFI CROP AI administration client (ADR-022)"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "lefi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native notifications for Lefi Brain's notifications, while the app runs (ADR-072). Local only.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
# All Brain traffic leaves from Rust (ADR-022). rustls only; never the system trust store.
reqwest = { version = "0.13", default-features = false, features = ["json", "cookies", "rustls", "http2"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mdns-sd = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
rcgen = { version = "0.13", features = ["pem"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
