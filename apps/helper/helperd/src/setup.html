<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lefi Crop · this PC</title>
<style>
:root{--bg:#f6f8f4;--card:#fff;--ink:#14231d;--muted:#5b6a63;--faint:#8a9891;--green:#2e7d55;--green-strong:#1f5f3f;--line:#dfe6e0;--sunken:#eff3ee;
--ok-bg:#e2f3e8;--ok:#1f6b45;--warn-bg:#fbefd4;--warn:#7f5400;--crit-bg:#fbe4e1;--crit:#a02c20;--info-bg:#e4eff7;--info:#1f5a85;--off-bg:#ebeeeb;--off:#59665f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1815;--card:#16221d;--ink:#e6efe9;--muted:#9fb0a8;--faint:#73847c;--green:#4cae7d;--green-strong:#7bd0a3;--line:#26362f;--sunken:#101b17;
--ok-bg:#163427;--ok:#7ed3a4;--warn-bg:#352a10;--warn:#efc873;--crit-bg:#3a1a17;--crit:#f2a79d;--info-bg:#15293a;--info:#93c6ee;--off-bg:#212c27;--off:#a3b1aa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:880px;margin:0 auto;padding:28px 16px 64px}
h1{font-size:25px;line-height:1.2;margin:0}
h2{font-size:16px;margin:0}
h3{font-size:13px;margin:16px 0 6px;color:var(--muted);font-weight:600}
p{margin:6px 0}
.muted{color:var(--muted)} .small{font-size:13px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0}
.card-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.grow{flex:1}
code,pre,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.ok{background:var(--ok-bg);color:var(--ok)} .warn{background:var(--warn-bg);color:var(--warn)}
.crit{background:var(--crit-bg);color:var(--crit)} .info{background:var(--info-bg);color:var(--info)} .off{background:var(--off-bg);color:var(--off)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{padding:5px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:13px;font-weight:600}
.btn:hover{border-color:var(--green)}
.btn:focus-visible,.comp:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.cmd{display:flex;gap:8px;align-items:flex-start;background:var(--sunken);border-radius:10px;padding:10px 12px;margin:8px 0}
.cmd code{flex:1;min-width:0;word-break:break-all;white-space:pre-wrap}
ol.wizard{list-style:none;margin:0;padding:0;counter-reset:s}
ol.wizard>li{counter-increment:s;position:relative;padding:0 0 18px 42px}
ol.wizard>li:last-child{padding-bottom:0}
ol.wizard>li::before{content:counter(s);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--ok-bg);color:var(--ok);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
ol.wizard strong{display:block}
ol.wizard>li.done::before{content:"✓"}
ol.wizard>li.todo::before{background:var(--sunken);color:var(--muted)}
input.code{font:600 18px ui-monospace,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase;width:190px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);margin-top:6px}
.bar{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden;margin:8px 0 4px}
.bar>div{height:100%;background:var(--green);border-radius:99px;transition:width .3s}
ol.steps{list-style:none;margin:10px 0 0;padding:0}
ol.steps li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
.dot{flex:none;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;margin-top:1px}
.dot.spinning{background:none;border:2.5px solid var(--line);border-top-color:var(--green);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.dot.spinning{animation-duration:2.4s}}
.step-body{min-width:0;flex:1}
.step-log{font-size:12.5px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.problem{border-radius:10px;padding:12px 14px;margin:10px 0;background:var(--crit-bg);color:var(--crit)}
.problem.warn{background:var(--warn-bg);color:var(--warn)} .problem.info{background:var(--info-bg);color:var(--info)}
.problem strong{display:block}
.problem .fix{margin-top:6px;color:var(--ink)}
details{margin-top:10px}
summary{cursor:pointer;font-weight:600;font-size:13.5px}
pre.log{max-height:420px;overflow:auto;background:var(--sunken);border-radius:10px;padding:12px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12.5px;line-height:1.45}
.comps{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.comp{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.comp:hover{border-color:var(--green)}
.comp[aria-expanded="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.comp[data-dim="1"] .comp-title{color:var(--muted)}
.comp-title{font-weight:650}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin:8px 0}
.kv div>span{display:block;font-size:12.5px;color:var(--muted)}
.kv div>b{font-weight:600;overflow-wrap:anywhere}
.big b{font-size:22px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:4px 0}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted)}
th,td{padding:5px 12px 5px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
tr:first-child th{border-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.tile-value{font-size:22px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums}
.spark{margin-top:8px}
.spark svg{display:block;width:100%;height:56px;touch-action:none;cursor:crosshair}
.spark .line{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .area{fill:var(--green);opacity:.12;stroke:none}
.spark .base{stroke:var(--line);stroke-width:1}
.spark .cross{stroke:var(--muted);stroke-width:1}
.spark-axis{display:flex;justify-content:space-between;gap:8px;margin-top:2px;font-size:11.5px}
.spark-read{text-align:center;font-variant-numeric:tabular-nums}
.history button{background:none;border:0;padding:0;text-decoration:underline;font-size:13.5px}
@media (max-width:520px){.card{padding:14px}}
</style>
</head>
<body>
<main>
  <div id="app"><p class="muted">Loading…</p></div>
  <noscript><p>This page needs JavaScript. Join from Terminal: <code>curl -fsS http://__IP__:__HTTP__/setup/join.sh | sh -s -- YOUR-CODE</code></p></noscript>
</main>
<script>

/* What the main PC can update here (ADR-062). Read-only: updates are started from the main PC. */

   h("div",{class:"card"},h("ol",{class:"wizard"},
    h("li",null,h("strong",null,"Get a one-time code on the main PC"),h("span",{class:"muted"},"Open Lefi Crop Helper there, go to Nodes and press Create a code. It works once, for 30 minutes.")),

    h("li",null,h("strong",null,"Open Terminal on this PC, paste this command and press Return"),h("div",{class:"cmd"},cmd,copyBtn(joinCommand)),

    h("li",null,h("strong",null,"Check the security fingerprint"),h("span",{class:"muted"},"The main PC's screen must show one starting with "),h("code",null,FP_SHORT),h("span",{class:"muted"},". If it differs, stop: you may not be talking to your main PC.")),
    h("li",null,h("strong",null,"Wait here"),h("span",{class:"muted"},"This page changes by itself when this PC has joined. Then choose what it runs on the main PC.")))),
   h("div",{class:"card"},h("h2",null,"If the command shows an error"),h("table",null,
    h("tr",null,h("th",null,"It says"),h("th",null,"What to do")),
    h("tr",null,h("td",null,h("code",null,"This join code is not valid")),h("td",null,"Check the code, or create a new one.")),
    h("tr",null,h("td",null,h("code",null,"already used"),", ",h("code",null,"expired")),h("td",null,"Create a new code on the main PC.")),
    h("tr",null,h("td",null,h("code",null,"created for the PC at")),h("td",null,"That code is for another address. Create one without an address.")),
    h("tr",null,h("td",null,h("code",null,"The licence covers")),h("td",null,"All the PCs of the licence are in use. Remove one on the main PC.")),

  h("div",{class:"card"},h("p",null,"Manage every PC from Lefi Crop Helper, in Nodes. To add another PC, open this address there:"),cmdBox("http://"+MAIN_IP+":"+HTTP_PORT+"/setup"))];}

/* ---- the installer's events, folded ---- */
function fold(messages){const r={steps:[],failure:null,output:[],result:null,log:null,rollback:null,bench:null};

      case"step.started":{const s=step(e.step);s.state="running";if(e.title)s.title=e.title;break;}
      case"step.ok":{const s=step(e.step);s.state=e.skipped?"skipped":"ok";s.reason=e.reason;break;}
      case"step.log":{const s=step(e.step);if(e.level==="error"||e.level==="warn"||e.level==="ok")s.logs.push(e.message);break;}
      case"step.warn":step(e.step).logs.push(e.message);break;

/* ---- components and their details ---- */
function compCard(c,assigned){const st=COMP_STATE[c.state]||[c.state,"off"];const info=COMP[c.id]||{t:c.id,d:""};const pending=!c.installed&&assigned.includes(c.id)&&c.state==="not_installed";

   h("span",{class:"comp-title"},info.t),h("span",{class:"muted small"},c.version?"Version "+c.version:info.d),
   h("span",null,pending?tag("Chosen, not installed yet","info"):tag(st[0],st[1])));}

  if(!ai){out.push(h("div",{class:"problem warn"},h("strong",null,"The AI does not answer on this PC."),h("div",{class:"fix"},c.installed?"Start it from the main PC: Nodes → this PC → AI node → Start.":"Install it from the main PC: Nodes → this PC → AI node → Install.")));return out;}
  const inMem=ai.loaded.reduce((a,z)=>a+z.size_gb,0);
  out.push(h("h3",null,"What the AI uses now"),h("div",{class:"kv big"},
    kv("Model memory",ai.loaded.length?gb(inMem):"None loaded"),
    kv("Model on GPU",ai.loaded.length?ai.loaded.map(z=>z.gpu_pct===null?"unknown":z.gpu_pct+"%").join(", "):"—"),
    kv("GPU in use",x.gpu_utilization_pct===null?null:x.gpu_utilization_pct+"%")));
  out.push(h("p",{class:"muted small"},"GPU in use counts every program on this PC, not only the AI. A model stays in memory for a few minutes after its last request."));

/* ---- charts: one measure each, the last hour, from this PC's heartbeats ---- */
const SVGNS="http://www.w3.org/2000/svg";

const gb=v=>v===null||v===undefined?null:(Math.round(v*10)/10)+" GB";
const clock=t=>new Date(t*1000).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
const WINDOW=3600,GAP=35;
function spark(samples,key,max,fmt,now,label){
  const W=300,H=56,pts=samples.filter(p=>p[key]!==null&&p[key]!==undefined&&p.t>=now-WINDOW);

  if(!pts.length){wrap.append(readout);return wrap;}
  const top=Math.max(max||0,...pts.map(p=>p[key]))||1;
  const X=t=>(t-(now-WINDOW))/WINDOW*W,Y=v=>H-2-(v/top)*(H-4);
  const svg=s("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"none",role:"img",
    "aria-label":label+", last hour: lowest "+fmt(Math.min(...pts.map(p=>p[key])))+", highest "+fmt(Math.max(...pts.map(p=>p[key])))+", now "+fmt(pts[pts.length-1][key])});
  svg.append(s("line",{x1:0,x2:W,y1:H-1,y2:H-1,class:"base","vector-effect":"non-scaling-stroke"}));
  // A heartbeat missing for longer than a few intervals is a gap, never a line drawn across it.
  let runs=[],run=[];for(const p of pts){if(run.length&&p.t-run[run.length-1].t>GAP){runs.push(run);run=[];}run.push(p);}runs.push(run);
  for(const r of runs){const d=r.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p[key]).toFixed(1)).join(" ");
    svg.append(s("path",{d:d+" L"+X(r[r.length-1].t).toFixed(1)+" "+(H-1)+" L"+X(r[0].t).toFixed(1)+" "+(H-1)+" Z",class:"area"}));
    svg.append(s("path",{d,class:"line","vector-effect":"non-scaling-stroke"}));}
  const cross=s("line",{y1:0,y2:H,class:"cross","vector-effect":"non-scaling-stroke",visibility:"hidden"});svg.append(cross);
  const move=e=>{const b=svg.getBoundingClientRect();const t=(now-WINDOW)+(e.clientX-b.left)/b.width*WINDOW;
    let best=pts[0];for(const p of pts)if(Math.abs(p.t-t)<Math.abs(best.t-t))best=p;
    const x=X(best.t);cross.setAttribute("x1",x);cross.setAttribute("x2",x);cross.setAttribute("visibility","visible");
    readout.textContent=clock(best.t)+" · "+fmt(best[key]);hovering=true;};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);
  svg.addEventListener("pointerleave",()=>{cross.setAttribute("visibility","hidden");readout.textContent="Last hour";hovering=false;});
  wrap.append(svg,h("div",{class:"spark-axis muted small"},h("span",null,"1 h ago"),readout,h("span",null,"now")));
  return wrap;}
function meter(pct){if(pct===null||pct===undefined||isNaN(pct))return null;const v=Math.max(0,Math.min(100,pct));

  sub?h("div",{class:"muted small"},sub):null,meter(pct),chart);}

function viewHome(m){const r=m.report,conn={online:["Connected","ok"],stale:["No signal for a while","warn"],offline:["Offline","crit"],never:["Waiting for its first signal","info"]}[m.connectivity]||[m.connectivity,"off"];

function render(force){if(!me)return;

async function loadLog(){const c=me&&me.command;if(!c)return;const id=c.command.id;
