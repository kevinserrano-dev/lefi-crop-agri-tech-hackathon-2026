name: lefi_mobile
description: "Lefi Crop mobile app — field operations for the LEFI CROP greenhouse platform."
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.1.3
  # Material Symbols Rounded bundled as a font (works offline, matches the design).
  material_symbols_icons: ^4.2960.0
  crypto: ^3.0.8
  basic_utils: ^5.8.2
  flutter_secure_storage: ^11.2.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  # Brand assets: symlink to the monorepo's canonical /assets/brand (approved designs only).
  assets:
    - assets/brand/

  # Fonts are bundled so the app never fetches anything from the internet (offline-first).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
