# Lefi Crop AI — model fit policy (INSTALLER.md §7.2, ADR-028). KEY=VALUE, read by the installer
# and `lefi hw`. These are POLICY values chosen to be conservative, not measurements; change
# them here, never in code.

# Memory kept free on the accelerator besides the model's measured footprint (GB).
GPU_HEADROOM_GB=1.5

# Minimum share of the loaded model that must sit in GPU memory after install (percent,
# measured with Ollama /api/ps size_vram / size). Lefi Crop requires the AI: CPU-only or
# partly offloaded models are refused (owner decision, 2026-11-05).
MIN_GPU_SHARE_PCT=100
