; The same sketch Arduino IDE opens (lefi_node/lefi_node.ino), built by PlatformIO.
; Checks: one environment per layout (ADR-063) with board.example.h, for Arduino-ESP32 2.x and 3.x.
; Flash a real board: pio run -e board -t upload  (uses LEFI_BOARD_FILE from lefi_config.h).
[platformio]
src_dir = lefi_node

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@7.4.2
  256dpi/MQTT@2.5.2
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@4.0.5

[env:board]

[env:dual]
build_flags = -DLEFI_BOARD_FILE='"board.example.h"' -DLEFI_LAYOUT=LEFI_LAYOUT_DUAL

[env:single-tds]
build_flags = -DLEFI_BOARD_FILE='"board.example.h"' -DLEFI_LAYOUT=LEFI_LAYOUT_SINGLE_TDS

[env:single]
build_flags = -DLEFI_BOARD_FILE='"board.example.h"' -DLEFI_LAYOUT=LEFI_LAYOUT_SINGLE

[env:dual-tds]
build_flags = -DLEFI_BOARD_FILE='"board.example.h"' -DLEFI_LAYOUT=LEFI_LAYOUT_DUAL_TDS

; Pins from the board file (ADR-065): air-1 + one DS18B20 per pin + TDS, air-2 left out (-1).
[env:custom]
build_flags = -DLEFI_BOARD_FILE='"board.example.h"' -DLEFI_LAYOUT=LEFI_LAYOUT_CUSTOM
  -DLEFI_PIN_AIR1_SDA=21 -DLEFI_PIN_AIR1_SCL=22 -DLEFI_PIN_WATER_TEMP1=4 -DLEFI_PIN_WATER_TEMP2=5 -DLEFI_PIN_TDS=34

; Arduino-ESP32 3.x (what a current Arduino IDE installs), community pioarduino platform.
; Needs PlatformIO Core 6.2.0 or later.
[env:dual-core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
build_flags = ${env:dual.build_flags}

[env:single-tds-core3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
build_flags = ${env:single-tds.build_flags}
