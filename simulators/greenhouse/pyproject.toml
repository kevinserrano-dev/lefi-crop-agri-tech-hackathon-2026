[project]
name = "lefi-sim"
version = "0.1.0"
description = "Lefi Crop greenhouse simulator: emulates ESP32 sensor nodes on the real MQTT contract (ADR-006, ADR-052)"
requires-python = ">=3.12"
license = { text = "Proprietary — see repository LICENSE" }
dependencies = ["aiomqtt>=2.3"]

[project.scripts]
lefi-sim = "lefi_sim.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "jsonschema>=4.23", "ruff>=0.8", "mypy>=1.13", "types-jsonschema>=4.23"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lefi_sim"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
