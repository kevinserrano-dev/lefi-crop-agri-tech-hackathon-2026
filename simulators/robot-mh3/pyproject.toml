[project]
name = "lefi-robot-sim"
version = "0.1.0"
description = "MH3 simulation bridge for Lefi Brain: drives the starter's MH3Simulation, serves pose, commands and simulated views (ADR-091)"
requires-python = ">=3.12"
license = { text = "Proprietary — see repository LICENSE" }
dependencies = []

[project.scripts]
lefi-robot-sim = "lefi_robot_sim.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lefi_robot_sim"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ", "RUF", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mh3_genesis.*", "numpy.*", "PIL.*"]  # the starter's environment only
ignore_missing_imports = true
