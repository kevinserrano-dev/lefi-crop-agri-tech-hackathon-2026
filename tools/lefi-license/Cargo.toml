[package]
name = "lefi-license"
version = "0.1.0"
description = "LEFI CROP activation codes: format and offline verification (library), issuing (staff tool)"
license = "MIT"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "lefi_license"
path = "src/lib.rs"

[[bin]]
name = "lefi-license"
path = "src/main.rs"
required-features = ["issue"]

[features]
default = []
# Signing, key generation and the staff CLI. Lefi Crop Helper depends on this crate WITHOUT it:
# the customer app can only verify.
issue = ["dep:getrandom"]

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = { version = "0.2", optional = true }
